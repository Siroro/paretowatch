[package]
name = "paretowatch"
version = "0.8.0"
edition = "2024"
description = "Lightweight native tray dashboard for Surplus Intelligence pricing and AI model Pareto frontiers"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
directories = "6"
eframe = { version = "0.36.1", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui_plot = "0.37.0"
notify-rust = "4.18.0"
postcard = { version = "1", features = ["alloc"] }
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.24.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# egui/epaint tessellation and text shaping dominate frame time when built
# unoptimized, which made dev runs feel like single-digit FPS on busy plots.
# Keep the app itself fast to compile but dependencies fully optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
